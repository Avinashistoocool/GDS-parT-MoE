site_name: GDS-ParT-MoE
site_description: "GDS-ParT-MoE by Avinash Chandra Gupta: mixture-of-experts particle transformer for jet tagging and what each expert learns."
site_url: https://avinashistoocool.github.io/GDS-parT-MoE/
site_author: Avinash Chandra Gupta
copyright: \"&copy; 2026 Avinash Chandra Gupta (Avinash Gupta) &middot; <a href='https://avinashistoocool.github.io/'>avinashistoocool.github.io</a>\"
repo_url: https://github.com/Avinashistoocool/GDS-parT-MoE
repo_name: Avinashistoocool/GDS-parT-MoE
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  *.tex

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/brightness-7, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - First results: results.md
  - Technical report (PDF): GDS-ParT-MoE_Technical_Report.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://avinashistoocool.github.io/
      name: Avinash Chandra Gupta
    - icon: fontawesome/brands/github
      link: https://github.com/Avinashistoocool
      name: Avinash Chandra Gupta on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/avinashistoocool
      name: Avinash Chandra Gupta on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/suprcoolavinash
      name: Avinash Chandra Gupta on X
